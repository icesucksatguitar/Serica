[package]
name = "serica-macos"
version = "0.5.4"
description = "Serica Browser - macOS implementation (Rust + Tauri v2 + WebKit)"
edition = "2021"
rust-version = "1.80"

[lib]
name = "serica_lib"
crate-type = ["rlib"]

[[bin]]
name = "serica"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
url = { version = "2.5", features = ["serde"] }
open = "5.3"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "socks"] }
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tauri-plugin-updater = "2"
# Verifies UI patches with the updater key (see ui_patch.rs).
minisign-verify = "0.3"
tauri-plugin-single-instance = "2"
# Importing from other browsers: their SQLite databases and password stores.
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
# Safari's Bookmarks.plist (binary property list).
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers", "objc2-core-graphics", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-web-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-uniform-type-identifiers = "0.3"
security-framework = "3"
core-foundation = "0.10"

[features]
# Embeds the built UI (dist/) instead of loading the dev server. `tauri build`
# enables this automatically; plain `cargo build --release` must pass it.
custom-protocol = ["tauri/custom-protocol"]
# Runtime verification hooks for test copies (src/automation.rs); never in a release.
automation = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
